name = "quick-todo"
id = "5jMqJX9e"
version = "1.0.0"
description = "A tiny and ultra fast todo app"
license = "MIT"
authors = ["HerrNamenlos123"]
type = "exe"

[app]
appId = "io.github.hazelang.QuickTodo"
displayName = "Quick Todo"
icon = "../resources/haze-logo.png"
categories = ["Utility"]

[scripts.linux]
# Release build, installed for the current user: the binary onto PATH, the
# desktop entry and icon where the desktop finds them. `install` replaces files
# rather than writing into them, so this works while the app is running. The
# desktop entry is also what lets the desktop's global shortcuts portal tell
# which app is asking for Ctrl+Alt+Space.
install = '''
haze build --release &&
install -Dm755 __haze__/quick-todo/bin/quick-todo ~/.local/bin/quick-todo &&
install -Dm644 __haze__/quick-todo/bin/io.github.hazelang.QuickTodo.desktop ~/.local/share/applications/io.github.hazelang.QuickTodo.desktop &&
install -Dm644 __haze__/quick-todo/bin/io.github.hazelang.QuickTodo.png ~/.local/share/icons/hicolor/512x512/apps/io.github.hazelang.QuickTodo.png &&
gtk-update-icon-cache -f -t ~/.local/share/icons/hicolor
'''
# The same, then starts the installed Quick Todo (detached from this shell).
install-run = 'haze install && setsid -f ~/.local/bin/quick-todo >/dev/null 2>&1'

[scripts.win32]
# Release build, installed for the current user where the login entry looks for
# it (%LOCALAPPDATA%\Programs\quick-todo, see ../stdlib/app/install-windows.ps1), with a Start menu
# entry. Works while Quick Todo is running, which keeps the old version until it
# is quit and started again.
install = 'haze build --release && powershell -NoProfile -ExecutionPolicy Bypass -File ../stdlib/app/install-windows.ps1 -Name quick-todo -DisplayName "Quick Todo"'
# The same, then starts the installed Quick Todo.
install-run = 'haze build --release && powershell -NoProfile -ExecutionPolicy Bypass -File ../stdlib/app/install-windows.ps1 -Name quick-todo -DisplayName "Quick Todo" -Run'

[dependencies]
ui_components = { path = "../stdlib/ui_components" }
ui_runtime = { path = "../stdlib/ui_runtime" }
app = { path = "../stdlib/app" }
sdl = { path = "../stdlib/sdl" }
image = { path = "../stdlib/image" }
single_instance = { path = "../stdlib/single_instance" }
autostart = { path = "../stdlib/autostart" }
quick_todo_ui = { path = "ui" }
