name = "quick-todo"
id = "5jMqJX9e"
version = "1.0.0"
description = "A tiny and ultra fast todo app"
license = "MIT"
authors = ["HerrNamenlos123"]
type = "exe"

[app]
appId = "io.github.herrnamenlos123.QuickTodo"
displayName = "Quick Todo"
icon = "../resources/haze-logo.png"
categories = ["Utility"]

[scripts.linux]
# Release build, installed for the current user: the binary onto PATH, the
# desktop entry and icon where the desktop finds them. `install` replaces files
# rather than writing into them, so this works while the app is running. The
# desktop entry is also what lets the desktop's global shortcuts portal tell
# which app is asking for Ctrl+Alt+Space.
install = '''
haze build --release &&
install -Dm755 __haze__/quick-todo/bin/quick-todo ~/.local/bin/quick-todo &&
install -Dm644 __haze__/quick-todo/bin/io.github.herrnamenlos123.QuickTodo.desktop ~/.local/share/applications/io.github.herrnamenlos123.QuickTodo.desktop &&
install -Dm644 __haze__/quick-todo/bin/io.github.herrnamenlos123.QuickTodo.png ~/.local/share/icons/hicolor/512x512/apps/io.github.herrnamenlos123.QuickTodo.png &&
gtk-update-icon-cache -f -t ~/.local/share/icons/hicolor
'''

[linker.win32]
flags = ["-Wl,/SUBSYSTEM:WINDOWS", "-Wl,/ENTRY:mainCRTStartup"]

[dependencies]
ui_components = { path = "../stdlib/ui_components" }
ui_runtime = { path = "../stdlib/ui_runtime" }
ui_widgets = { path = "../stdlib/ui_widgets" }
codicons = { path = "../stdlib/codicons" }
app = { path = "../stdlib/app" }
sdl = { path = "../stdlib/sdl" }
image = { path = "../stdlib/image" }
single_instance = { path = "../stdlib/single_instance" }
autostart = { path = "../stdlib/autostart" }
hzui = { path = "../stdlib/hzui" }

[plugins]
hzui = { path = "../stdlib/hzui" }
