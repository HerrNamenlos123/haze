
name = "codeeditor"
id = "e9sfLnGn"
version = "0.1.0"
description = ""
license = "MIT"
authors = []
type = "exe"

[scripts]
build = "haze build"
run = "haze run"
test = "haze test"

[dependencies]
# Core runtime and UI framework stuff
text_document = { path = "../stdlib/text_document" }
ui_components = { path = "../stdlib/ui_components" }
ui_elements = { path = "../stdlib/ui_elements" }
ui_styling = { path = "../stdlib/ui_styling" }
ui_runtime = { path = "../stdlib/ui_runtime" }
headwind = { path = "../stdlib/headwind" }
ui_widgets = { path = "../stdlib/ui_widgets" }
renderer = { path = "../stdlib/renderer" }
app = { path = "../stdlib/app" }
wgpu = { path = "../stdlib/wgpu" }
codicons = { path = "../stdlib/codicons" }

# Actual application and business logic
filedialog = { path = "../stdlib/filedialog" }
textedit_behavior = { path = "../stdlib/textedit_behavior" }
vim_behavior = { path = "../stdlib/vim_behavior" }
language_server_protocol = { path = "../stdlib/language_server_protocol" }
unicode = { path = "../stdlib/unicode" }
fuzzymatch = { path = "../stdlib/fuzzymatch" }
claude = { path = "../stdlib/claude" }
# Chat, tool permissions, model selection and sign-in, over stdlib/claude.
# Declared but not yet mounted anywhere -- see stdlib/claude_ui/README.md.
claude_ui = { path = "../stdlib/claude_ui" }
# The SFC transformer below generates `from hzui import ...` into every
# .hzui file in this module, so hzui is a real dependency, not only a plugin.
hzui = { path = "../stdlib/hzui" }

[plugins]
hzui = { path = "../stdlib/hzui" }
