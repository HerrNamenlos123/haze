name = "tesselate"
id = "fX1KHZdL"
version = "1.0.0"
description = "Experimental Tesselation primitives for Haze"
license = "MIT"
authors = ["HerrNamenlos123"]
type = "lib"

[generator.build-tesselator]
exec = "scripts/build-tesselator.hz"
# The Rust sources, so changing them rebuilds the library.
inputs = [
    { module="this", dir="root", path="lyon/Cargo.toml" },
    { module="this", dir="root", path="lyon/src/lib.rs" },
]
outputs = [
    { module="this", dir="bin", path="include/tesselator.h" },
    { module="this", dir="bin", path="lib/tesselator.lib", platform="win32" },
    { module="this", dir="bin", path="lib/libtesselator.a", platform="linux" },
]

[linker]
flags = ["-ltesselator"]