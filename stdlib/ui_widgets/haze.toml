name = "ui_widgets"
id = "Uw1dGe7s"
version = "0.0.1"
description = "Generic, reusable widgets: Button, TextInput, Dropdown and FloatingPanel"
license = "MIT"
authors = []
type = "lib"

[dependencies]
textedit_behavior = { path = "../textedit_behavior" }
# For stepping the caret by grapheme cluster rather than by byte -- see
# textinput.hzui's columnAtX.
unicode = { path = "../unicode" }
ui_components = { path = "../ui_components" }
ui_elements = { path = "../ui_elements" }
ui_styling = { path = "../ui_styling" }
headwind = { path = "../headwind" }
codicons = { path = "../codicons" }
# The SFC transformer below generates `from hzui import ...` into every
# .hzui file in this module, so hzui is a real dependency, not only a plugin.
hzui = { path = "../hzui" }

[plugins]
hzui = { path = "../hzui" }
